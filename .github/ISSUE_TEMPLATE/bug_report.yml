name: Bug report
description: Report something that does not work as expected
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For **security** issues, use [SECURITY.md](../SECURITY.md) instead of a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps help a lot.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Students
        - Bills / sessions
        - Calendar
        - Report
        - Auth / settings
        - Notifications / PWA
        - Docker / deploy
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: e.g. Docker Compose, local yarn dev, browser, OS
    validations:
      required: false
